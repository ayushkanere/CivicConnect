{% extends "base.html" %}

{% block title %}403 - Access Forbidden{% endblock %}

{% block content %}
<div class="container" style="max-width: 560px; padding-top: var(--space-12); text-align: center;">
  <div class="card" style="padding: var(--space-8);">
    <div style="font-size: var(--text-4xl); font-weight: 800; color: var(--color-danger); margin-bottom: var(--space-2);">
      403
    </div>
    <h1 style="font-size: var(--text-2xl); margin-bottom: var(--space-2);">Access Prohibited</h1>
    <p class="text-muted" style="margin-bottom: var(--space-6); font-size: var(--text-sm);">
      You do not have permission to access this resource. If you are an authorized administrator, please sign in.
    </p>
    <div style="display: flex; gap: var(--space-3); justify-content: center;">
      <a href="{{ url_for('admin.login') }}" class="btn btn-primary">Admin Sign In</a>
      <a href="{{ url_for('public.home') }}" class="btn btn-secondary">Homepage</a>
    </div>
  </div>
</div>
{% endblock %}
