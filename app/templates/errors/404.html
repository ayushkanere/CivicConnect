{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container" style="max-width: 560px; padding-top: var(--space-12); text-align: center;">
  <div class="card" style="padding: var(--space-8);">
    <div style="font-size: var(--text-4xl); font-weight: 800; color: var(--primary); margin-bottom: var(--space-2);">
      404
    </div>
    <h1 style="font-size: var(--text-2xl); margin-bottom: var(--space-2);">Page Not Found</h1>
    <p class="text-muted" style="margin-bottom: var(--space-6); font-size: var(--text-sm);">
      The page or record you requested does not exist or may have been moved.
    </p>
    <div style="display: flex; gap: var(--space-3); justify-content: center;">
      <a href="{{ url_for('public.home') }}" class="btn btn-primary">Return Home</a>
      <a href="{{ url_for('public.track') }}" class="btn btn-secondary">Track Report</a>
    </div>
  </div>
</div>
{% endblock %}
