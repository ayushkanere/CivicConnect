{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container" style="max-width: 560px; padding-top: var(--space-12); text-align: center;">
  <div class="card" style="padding: var(--space-8);">
    <div style="font-size: var(--text-4xl); font-weight: 800; color: var(--color-danger); margin-bottom: var(--space-2);">
      500
    </div>
    <h1 style="font-size: var(--text-2xl); margin-bottom: var(--space-2);">Internal Processing Error</h1>
    <p class="text-muted" style="margin-bottom: var(--space-6); font-size: var(--text-sm);">
      An unexpected condition occurred on the server. The team has been notified. Please try again shortly or contact the CEP project lead.
    </p>
    <a href="{{ url_for('public.home') }}" class="btn btn-primary">Return to Homepage</a>
  </div>
</div>
{% endblock %}
